
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: resolveai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai_dev_password
      POSTGRES_DB: resolveai_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
